name: unit-tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run tests
        run: make test
